<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Profile — VerifyPlug</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="icon" href="/logo.png" type="image/png">
</head>

<body>

  <!-- TOPBAR -->
  <div class="topbar">
    <a href="index.html" class="brand">
      <span class="brand-seal"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.2 4.2L19 7" stroke="#1a1505" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      VerifyPlug
    </a>
    <a href="auth.html" class="topbar-tag">Sign in</a>
  </div>

  <div class="container" style="max-width:600px;">
    <div id="profile">
      <div class="card"><p>Loading vendor…</p></div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, getDocs, addDoc, query, where }
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAFkCQI646z0NTyKZB1ZL7D5EYZuxGTSlY",
      authDomain: "verifyplug-a28d6.firebaseapp.com",
      projectId: "verifyplug-a28d6",
      storageBucket: "verifyplug-a28d6.firebasestorage.app",
      messagingSenderId: "244761045495",
      appId: "1:244761045495:web:4c2f0091a7a46a7272e6f2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const box = document.getElementById("profile");

    // state shared between load() and the review submit
    let currentUser = null;
    let vendorData = null;
    let vendorId = null;

    onAuthStateChanged(auth, u => { currentUser = u; applyAuthUI(); });

    // ---------- small helpers ----------
    function escapeHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showToast(msg, type = "success") {
      let t = document.getElementById("toast");
      if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
      t.textContent = msg;
      t.className = "";
      t.classList.add(type, "show");
      clearTimeout(window._tt);
      window._tt = setTimeout(() => t.classList.remove("show"), 3200);
    }

    function getDeviceId() {
      let id = localStorage.getItem("deviceId");
      if (!id) { id = crypto.randomUUID(); localStorage.setItem("deviceId", id); }
      return id;
    }
    const deviceId = getDeviceId();

    function getVendorStatus(s) {
      if (s >= 90) return { label: "Highly Recommended", className: "status-recommended", icon: "fa-award" };
      if (s >= 70) return { label: "Trusted Vendor", className: "status-trusted", icon: "fa-circle-check" };
      if (s >= 50) return { label: "Normal Vendor", className: "status-normal", icon: "fa-circle" };
      if (s >= 21) return { label: "Risky Vendor", className: "status-weak", icon: "fa-triangle-exclamation" };
      return { label: "Banned Vendor", className: "status-banned", icon: "fa-ban" };
    }

    function card(html) { return `<div class="card reveal">${html}</div>`; }

    // turn handles/numbers into safe outbound links
    function buildSocialLinks(s = {}) {
      const L = {};
      const handle = v => (v || "").trim()
        .replace(/^@/, "")
        .replace(/^https?:\/\/(www\.)?[^/]+\//, "")
        .replace(/[^A-Za-z0-9._]/g, "");
      let wa = (s.whatsapp || "").replace(/[^\d]/g, "");
      if (wa) { if (wa.startsWith("0")) wa = "234" + wa.slice(1); L.whatsapp = "https://wa.me/" + wa; }
      const ig = handle(s.instagram); if (ig) L.instagram = "https://instagram.com/" + ig;
      const tt = handle(s.tiktok);    if (tt) L.tiktok = "https://tiktok.com/@" + tt;
      const x  = handle(s.x);         if (x)  L.x = "https://x.com/" + x;
      return L;
    }

    function socialIcons(s) {
      const L = buildSocialLinks(s || {});
      const map = [["whatsapp","fa-whatsapp"],["instagram","fa-instagram"],["tiktok","fa-tiktok"],["x","fa-x-twitter"]];
      const items = map.filter(([k]) => L[k])
        .map(([k,ic]) => `<a class="social-link" href="${L[k]}" target="_blank" rel="noopener noreferrer" aria-label="${k}"><i class="fa-brands ${ic}"></i></a>`)
        .join("");
      return items ? `<div class="socials">${items}</div>` : "";
    }

    function ratingOptions() {
      let o = `<option value="">Select…</option>`;
      for (let i = 10; i >= 1; i--) o += `<option value="${i}">${i}/10</option>`;
      return o;
    }

    // show the purchase-code box only to signed-in users; show the sign-in nudge to everyone else
    function applyAuthUI() {
      const codeField = document.getElementById("codeField");
      const prompt = document.getElementById("verifyPrompt");
      if (!codeField || !prompt) return; // review form not on the page yet
      const signedIn = !!currentUser;
      codeField.style.display = signedIn ? "block" : "none";
      prompt.style.display = signedIn ? "none" : "block";
    }

    // ---------- submit a review (verified tier gated to signed-in users) ----------
    window.submitProfileReview = async function () {
      const rating = Number(document.getElementById("revRating").value);
      const pros = document.getElementById("revPros").value.trim();
      const cons = document.getElementById("revCons").value.trim();
      const codeEl = document.getElementById("revCode");
      const code = codeEl ? codeEl.value.trim() : "";

      if (!rating) { showToast("Pick a rating first", "warning"); return; }

      try {
        const dq = query(collection(db, "vendors", vendorId, "reviews"), where("deviceId", "==", deviceId));
        const existing = await getDocs(dq);
        if (!existing.empty) { showToast("You already reviewed this vendor", "warning"); return; }

        let verifiedPurchase = false;
        if (code) {
          const codes = (vendorData && vendorData.purchaseCodes) || [];
          if (codes.includes(code)) verifiedPurchase = true;
        }

        await addDoc(collection(db, "vendors", vendorId, "reviews"), {
          userId: currentUser ? currentUser.uid : null,
          userEmail: currentUser ? currentUser.email : null,
          deviceId,
          rating, pros, cons,
          verifiedPurchase,
          createdAt: new Date()
        });

        showToast("Review posted", "success");
        load();
      } catch (e) {
        console.error(e);
        showToast("Couldn’t post your review", "error");
      }
    };

    // ---------- load the profile ----------
    async function load() {

      const id = new URLSearchParams(location.search).get("id");
      vendorId = id;

      if (!id) {
        box.innerHTML = card(`<h2>Invalid link</h2><p>No vendor was specified.</p>
          <a href="auth.html" class="btn" style="margin-top:14px;">Verify a vendor</a>`);
        return;
      }

      let snap;
      try {
        snap = await getDoc(doc(db, "vendors", id));
      } catch (e) {
        box.innerHTML = card(`<h2>Couldn’t load profile</h2><p>Please try again in a moment.</p>`);
        return;
      }

      if (!snap.exists()) {
        box.innerHTML = card(`<h2>Vendor not found</h2>
          <p>This vendor isn’t on VerifyPlug yet.</p>
          <a href="auth.html" class="btn" style="margin-top:14px;">Verify another vendor</a>`);
        return;
      }

      const d = snap.data();
      vendorData = d;
      document.title = `${d.name || "Vendor"} — VerifyPlug`;
      const trust = d.trustScore ?? 50;
      const status = getVendorStatus(trust);
      const verified = d.verified === true && d.banned !== true;

      const avatarInner = d.photoURL
        ? `<img src="${escapeHtml(d.photoURL)}" alt="${escapeHtml(d.name) || "Vendor"}">`
        : `<i class="fa-solid fa-store fb"></i>`;

      // BANNED — warn the buyer loudly (no review form for banned vendors)
      if (d.banned === true) {
        box.innerHTML = `
          <div class="v-panel v-hero reveal">
            <div class="trust-avatar" style="--p:${trust}">
              <div class="trust-avatar-inner">${avatarInner}</div>
            </div>
            <div class="badges" style="justify-content:center;margin-bottom:10px;">
              <span class="status-banned"><i class="fa-solid fa-ban"></i> Restricted</span>
            </div>
            <h1>${escapeHtml(d.name) || "This vendor"}</h1>
            <p style="color:var(--red);font-weight:500;margin-top:8px;">
              This vendor has been flagged and restricted for policy violations. Do not send money.
            </p>
            <a href="auth.html" class="btn" style="margin-top:18px;">Check a safer vendor</a>
          </div>
        `;
        return;
      }

      // Reviews (public read)
      let reviewsHtml = `<p class="muted-text">No reviews yet — be the first.</p>`;
      let reviewCount = 0;
      try {
        const rs = await getDocs(collection(db, "vendors", id, "reviews"));
        reviewCount = rs.size;
        if (!rs.empty) {
          reviewsHtml = "";
          rs.forEach(r => {
            const rv = r.data();
            reviewsHtml += `
              <div class="review">
                <div class="review-top">
                  <span class="rating-pill"><i class="fa-solid fa-star"></i> ${Number(rv.rating) || 0}/10</span>
                  ${rv.verifiedPurchase ? `<span class="rev-verified"><i class="fa-solid fa-circle-check"></i> Verified</span>` : ""}
                </div>
                <p class="rp">${escapeHtml(rv.pros) || "—"}</p>
                ${rv.cons ? `<p class="rc">${escapeHtml(rv.cons)}</p>` : ""}
              </div>`;
          });
        }
      } catch (e) { /* reviews stay as "none" if rules block */ }

      box.innerHTML = `
        <div class="v-panel v-hero reveal">
          <div class="trust-avatar" style="--p:${trust}">
            <div class="trust-avatar-inner">${avatarInner}</div>
          </div>
          <div class="trust-pct"><i class="fa-solid fa-shield-halved"></i> ${trust}% trust score</div>
          <h1>${escapeHtml(d.name) || "Vendor"}</h1>
          <div class="badges" style="justify-content:center;">
            <span class="${status.className}"><i class="fa-solid ${status.icon}"></i> ${status.label}</span>
            ${verified ? `<span class="verified-badge"><i class="fa-solid fa-circle-check"></i> Verified</span>` : ""}
          </div>
        </div>

        <div class="v-panel reveal">
          <div class="v-panel-head"><span class="eyebrow">Vendor details</span></div>
          <div class="info-row">
            <div class="chip"><i class="fa-solid fa-tag"></i></div>
            <div class="meta"><span class="rl">Category</span><span class="rv">${escapeHtml(d.category) || "—"}</span></div>
          </div>
          <div class="info-row">
            <div class="chip"><i class="fa-solid fa-location-dot"></i></div>
            <div class="meta"><span class="rl">Location</span><span class="rv">${escapeHtml(d.location) || "—"}</span></div>
          </div>
          <div class="info-row">
            <div class="chip"><i class="fa-solid fa-star"></i></div>
            <div class="meta"><span class="rl">Average rating</span><span class="rv">${Number(d.averageRating) || 0}/10 · ${reviewCount} review${reviewCount === 1 ? "" : "s"}</span></div>
          </div>
          ${socialIcons(d.socials)}
        </div>

        <div class="v-panel reveal">
          <div class="v-panel-head"><span class="eyebrow">Reviews</span><span class="topbar-tag">${reviewCount}</span></div>
          ${reviewsHtml}
        </div>

        <div class="v-panel reveal">
          <div class="v-panel-head"><span class="eyebrow">Write a review</span></div>
          <label>Rating</label>
          <select id="revRating">${ratingOptions()}</select>
          <label style="margin-top:10px;">What was good?</label>
          <textarea id="revPros" rows="2" placeholder="Pros"></textarea>
          <label style="margin-top:10px;">Any issues?</label>
          <textarea id="revCons" rows="2" placeholder="Cons"></textarea>

          <div id="codeField" style="display:none;">
            <label style="margin-top:10px;">Purchase code (for a verified review)</label>
            <input id="revCode" placeholder="VP-12345">
          </div>

          <button onclick="submitProfileReview()" style="margin-top:14px;">Post review</button>

          <p id="verifyPrompt" style="display:none;margin-top:12px;font-size:14px;color:var(--muted);">
            <i class="fa-solid fa-lock" style="color:var(--gold-deep);margin-right:4px;"></i>
            Bought from this vendor? <a href="auth.html" style="color:var(--gold-deep);font-weight:600;">Sign in to leave a verified review</a>
          </p>
        </div>

        <div class="v-panel reveal" style="text-align:center;">
          <i class="fa-solid fa-shield-halved" style="font-size:26px;color:var(--gold-deep);"></i>
          <h3 style="margin-top:10px;">About to buy from someone?</h3>
          <p style="margin:6px 0 0;">Check any vendor’s trust score before you pay.</p>
          <a href="auth.html" class="btn" style="margin-top:16px;">Verify a vendor</a>
        </div>
      `;

      applyAuthUI();
    }

    load();
  </script>
</body>
</html>
