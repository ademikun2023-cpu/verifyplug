<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Profile — VerifyPlug</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="icon" href="/logo.png" type="image/png">
  <style>
    .socials{display:flex;gap:12px;justify-content:center;margin-top:20px}
    .social-link{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
      border:1px solid var(--gold-line);background:var(--gold-soft);color:var(--gold-deep);
      font-size:19px;text-decoration:none;transition:.2s}
    .social-link:hover{background:var(--gold);color:#1a1505;transform:translateY(-2px)}
    .v-avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 10px;
      border:2px solid var(--gold-line);box-shadow:var(--sh-sm)}
    .v-avatar--fallback{display:grid;place-items:center;background:var(--gold-soft);color:var(--gold-deep)}
    .v-avatar--fallback svg{width:40px;height:40px}
  </style>
</head>

<body>

  <!-- TOPBAR -->
  <div class="topbar">
    <a href="index.html" class="brand">
      <span class="brand-seal"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.2 4.2L19 7" stroke="#1a1505" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      VerifyPlug
    </a>
    <a href="auth.html" class="topbar-tag">Sign in</a>
  </div>

  <div class="container" style="max-width:620px;">
    <div id="profile">
      <div class="card"><p>Loading vendor…</p></div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, getDocs, addDoc, query, where }
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAFkCQI646z0NTyKZB1ZL7D5EYZuxGTSlY",
      authDomain: "verifyplug-a28d6.firebaseapp.com",
      projectId: "verifyplug-a28d6",
      storageBucket: "verifyplug-a28d6.firebasestorage.app",
      messagingSenderId: "244761045495",
      appId: "1:244761045495:web:4c2f0091a7a46a7272e6f2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const box = document.getElementById("profile");

    // state shared between load() and the review submit
    let currentUser = null;
    let vendorData = null;
    let vendorId = null;

    onAuthStateChanged(auth, u => { currentUser = u; });

    // ---------- small helpers ----------
    function showToast(msg, type = "success") {
      let t = document.getElementById("toast");
      if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
      t.textContent = msg;
      t.className = "";
      t.classList.add(type, "show");
      clearTimeout(window._tt);
      window._tt = setTimeout(() => t.classList.remove("show"), 3200);
    }

    function getDeviceId() {
      let id = localStorage.getItem("deviceId");
      if (!id) { id = crypto.randomUUID(); localStorage.setItem("deviceId", id); }
      return id;
    }
    const deviceId = getDeviceId();

    function getVendorStatus(s) {
      if (s >= 90) return { label: "Highly Recommended", className: "status-recommended" };
      if (s >= 70) return { label: "Trusted Vendor", className: "status-trusted" };
      if (s >= 50) return { label: "Normal Vendor", className: "status-normal" };
      if (s >= 21) return { label: "Risky Vendor", className: "status-weak" };
      return { label: "Banned Vendor", className: "status-banned" };
    }

    function card(html) { return `<div class="card reveal">${html}</div>`; }

    // turn handles/numbers into safe outbound links
    function buildSocialLinks(s = {}) {
      const L = {};
      const handle = v => (v || "").trim()
        .replace(/^@/, "")
        .replace(/^https?:\/\/(www\.)?[^/]+\//, "")
        .replace(/[^A-Za-z0-9._]/g, "");
      let wa = (s.whatsapp || "").replace(/[^\d]/g, "");
      if (wa) { if (wa.startsWith("0")) wa = "234" + wa.slice(1); L.whatsapp = "https://wa.me/" + wa; }
      const ig = handle(s.instagram); if (ig) L.instagram = "https://instagram.com/" + ig;
      const tt = handle(s.tiktok);    if (tt) L.tiktok = "https://tiktok.com/@" + tt;
      const x  = handle(s.x);         if (x)  L.x = "https://x.com/" + x;
      return L;
    }

    function socialIcons(s) {
      const L = buildSocialLinks(s || {});
      const map = [["whatsapp","fa-whatsapp"],["instagram","fa-instagram"],["tiktok","fa-tiktok"],["x","fa-x-twitter"]];
      const items = map.filter(([k]) => L[k])
        .map(([k,ic]) => `<a class="social-link" href="${L[k]}" target="_blank" rel="noopener noreferrer" aria-label="${k}"><i class="fa-brands ${ic}"></i></a>`)
        .join("");
      return items ? `<div class="socials">${items}</div>` : "";
    }

    function ratingOptions() {
      let o = `<option value="">Select…</option>`;
      for (let i = 10; i >= 1; i--) o += `<option value="${i}">${i}/10</option>`;
      return o;
    }

    // ---------- submit a review (auth-gated) ----------
    window.submitProfileReview = async function () {
      const rating = Number(document.getElementById("revRating").value);
      const pros = document.getElementById("revPros").value.trim();
      const cons = document.getElementById("revCons").value.trim();
      const code = document.getElementById("revCode").value.trim();

      if (!rating) { showToast("Pick a rating first", "warning"); return; }

      // not logged in → save their draft and ask them to sign in
      if (!currentUser) {
        localStorage.setItem("vp_review_draft_" + vendorId, JSON.stringify({ rating, pros, cons, code }));
        const prompt = document.getElementById("authPrompt");
        if (prompt) prompt.style.display = "block";
        showToast("Log in or create an account to post your review", "warning");
        return;
      }

      try {
        // one review per device
        const dq = query(collection(db, "vendors", vendorId, "reviews"), where("deviceId", "==", deviceId));
        const existing = await getDocs(dq);
        if (!existing.empty) { showToast("You already reviewed this vendor", "warning"); return; }

        // verify purchase code if given
        let verifiedPurchase = false;
        if (code) {
          const codes = (vendorData && vendorData.purchaseCodes) || [];
          if (codes.includes(code)) verifiedPurchase = true;
        }

        await addDoc(collection(db, "vendors", vendorId, "reviews"), {
          userId: currentUser.uid,
          userEmail: currentUser.email,
          deviceId,
          rating, pros, cons,
          verifiedPurchase,
          createdAt: new Date()
        });

        localStorage.removeItem("vp_review_draft_" + vendorId);
        showToast("Review submitted ✔", "success");
        load(); // refresh the profile + reviews
      } catch (e) {
        console.error(e);
        showToast("Couldn’t submit review", "error");
      }
    };

    // ---------- load the profile ----------
    async function load() {

      const id = new URLSearchParams(location.search).get("id");
      vendorId = id;

      if (!id) {
        box.innerHTML = card(`<h2>Invalid link</h2><p>No vendor was specified.</p>
          <a href="auth.html" class="btn" style="margin-top:14px;">Verify a vendor</a>`);
        return;
      }

      let snap;
      try {
        snap = await getDoc(doc(db, "vendors", id));
      } catch (e) {
        box.innerHTML = card(`<h2>Couldn’t load profile</h2><p>Please try again later.</p>`);
        return;
      }

      if (!snap.exists()) {
        box.innerHTML = card(`<h2>Vendor not found</h2>
          <p>This vendor isn’t on VerifyPlug yet.</p>
          <a href="auth.html" class="btn" style="margin-top:14px;">Verify another vendor</a>`);
        return;
      }

      const d = snap.data();
      vendorData = d;
      document.title = `${d.name || "Vendor"} — VerifyPlug`;
      const trust = d.trustScore ?? 50;
      const status = getVendorStatus(trust);
      const verified = d.verified === true && d.banned !== true;

      const avatar = d.photoURL
        ? `<img class="v-avatar" src="${d.photoURL}" alt="${d.name || "Vendor"}">`
        : `<div class="v-avatar v-avatar--fallback"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.2 4.2L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;

      // BANNED — warn the buyer loudly (no review form for banned vendors)
      if (d.banned === true) {
        box.innerHTML = card(`
          <div class="badges"><span class="status-banned">🚫 Restricted</span></div>
          <h2 style="margin-top:12px;">${d.name || "This vendor"}</h2>
          <p style="color:var(--red);font-weight:500;margin-top:8px;">
            This vendor has been flagged and restricted for policy violations. Do not send money.
          </p>
          <a href="auth.html" class="btn" style="margin-top:16px;">Check a safer vendor</a>
        `);
        return;
      }

      // Reviews (public read)
      let reviewsHtml = `<p class="muted-text">No reviews yet. Be the first.</p>`;
      let reviewCount = 0;
      try {
        const rs = await getDocs(collection(db, "vendors", id, "reviews"));
        reviewCount = rs.size;
        if (!rs.empty) {
          reviewsHtml = "";
          rs.forEach(r => {
            const rv = r.data();
            reviewsHtml += `
              <div class="result-card">
                <h3>⭐ ${rv.rating}/10 ${rv.verifiedPurchase ? "· ✅ Verified" : ""}</h3>
                <p style="margin-top:6px;"><b>Pros:</b> ${rv.pros || "—"}</p>
                <p style="margin-top:4px;"><b>Cons:</b> ${rv.cons || "—"}</p>
              </div>`;
          });
        }
      } catch (e) { /* reviews stay as "none" if rules block */ }

      box.innerHTML = `
        <div class="card reveal" style="text-align:center;">
          ${avatar}
          <div class="trust-ring" style="--p:${trust}">
            <div class="inner"><b>${trust}%</b><span>Trust</span></div>
          </div>
          <h1 style="font-size:30px;margin-top:6px;">${d.name || "Vendor"}</h1>
          <div class="badges" style="justify-content:center;margin-top:12px;">
            <span class="${status.className}">${status.label}</span>
            ${verified ? `<span class="verified-badge">✅ Verified</span>` : ""}
          </div>
          <div style="margin-top:18px;text-align:left;">
            <p>📂 ${d.category || "—"}</p>
            <p>🧾 ${d.location || "—"}</p>
            <p>⭐ Average rating: ${d.averageRating || 0}/10 · ${reviewCount} review${reviewCount === 1 ? "" : "s"}</p>
          </div>
          ${socialIcons(d.socials)}
        </div>

        <div class="card reveal" style="margin-top:16px;">
          <h2>Reviews</h2>
          <div style="margin-top:12px;">${reviewsHtml}</div>
        </div>

        <div class="card reveal" style="margin-top:16px;">
          <h2>Write a review</h2>
          <label style="display:block;margin-top:10px;">Rating</label>
          <select id="revRating">${ratingOptions()}</select>
          <label style="display:block;margin-top:10px;">What was good?</label>
          <textarea id="revPros" rows="2" placeholder="Pros"></textarea>
          <label style="display:block;margin-top:10px;">Any issues?</label>
          <textarea id="revCons" rows="2" placeholder="Cons"></textarea>
          <label style="display:block;margin-top:10px;">Purchase code (optional)</label>
          <input id="revCode" placeholder="VP-12345">
          <button onclick="submitProfileReview()" style="margin-top:12px;">Submit review</button>

          <div id="authPrompt" style="display:none;margin-top:14px;padding:14px;border:1px solid var(--gold-line);border-radius:12px;background:var(--gold-soft);">
            <p style="margin:0 0 10px;font-weight:500;">You need an account to post a review.</p>
            <a href="auth.html" class="btn">Log in / Create account</a>
          </div>
        </div>

        <div class="card reveal" style="margin-top:16px;text-align:center;">
          <h3>About to buy from someone?</h3>
          <p style="margin:6px 0 0;">Check any vendor’s trust score before you pay.</p>
          <a href="auth.html" class="btn" style="margin-top:14px;">Verify a vendor</a>
        </div>
      `;

      // restore a saved draft (e.g. after they went to log in and came back)
      const draft = JSON.parse(localStorage.getItem("vp_review_draft_" + id) || "null");
      if (draft) {
        document.getElementById("revRating").value = draft.rating || "";
        document.getElementById("revPros").value = draft.pros || "";
        document.getElementById("revCons").value = draft.cons || "";
        document.getElementById("revCode").value = draft.code || "";
      }
    }

    load();
  </script>
</body>
</html>
