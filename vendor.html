<!DOCTYPE html>
<html>
<head>
  <title>Vendor Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="topbar">
  VerifyPlug Vendor
</div>

<!-- 🚫 BAN SCREEN (NEW) -->
<div id="banScreen" style="display:none; text-align:center; padding:50px;">
  <h1 style="color:red;">🚫 ACCOUNT BANNED</h1>
  <p>Your account has been banned due to unethical business practices.</p>
  <p>You can no longer access VerifyPlug services.</p>
</div>

<!-- STATUS -->
<div class="status-wrapper">
  <div id="statusDot" class="status-dot"></div>
  <span id="statusText">Not Verified</span>
</div>

<!-- ✅ MAIN CONTAINER -->
<div class="container" id="mainContainer">

  <!-- ADD BUSINESS FORM -->
  <div class="card" id="vendorForm">

    <h2>Add Your Business</h2>

    <input id="vendorName" placeholder="Business Name">
    <input id="vendorPhone" placeholder="Phone Number">
    <input id="vendorLocation" placeholder="Location">

    <button onclick="addVendor()">
      Add Business
    </button>

  </div>

  <!-- DASHBOARD -->
  <div class="card" id="vendorDashboard" style="display:none;">

    <h2 id="welcomeText">Hi Vendor 👋</h2>

    <div>
      <b>Trust Score</b>
      <div class="trust-bar">
        <div class="trust-fill" id="trustFill"></div>
      </div>
      <small id="trustText">0%</small>
    </div>

    <div>
      <b>Total Searches</b>
      <h1 id="searchCount">0</h1>
    </div>

    <button id="verifyBtn">
      Pay ₦5,000 For Verification
    </button>

  </div>

</div>

<!-- TOAST -->
<div id="toast"></div>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script type="module" src="./app.js"></script>

</body>
</html>
