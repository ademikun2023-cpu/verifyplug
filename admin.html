<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="topbar">
  VerifyPlug Admin Panel
</div>

<div class="container">

  <!-- SCAM REPORTS -->
 <div class="card">

  <h2>Scam Reports Inbox</h2>

  <div id="reportsList"></div>

</div>

<!-- MODAL -->
<div id="reportModal" class="modal">

  <div class="modal-content">

    <h3>Report Details</h3>

    <p id="modalEmail"></p>
    <p id="modalPhone"></p>
    <p id="modalReason"></p>

    <button id="banBtn">Ban Vendor</button>

    <button onclick="closeModal()">
      Close
    </button>

  </div>

</div>

  <!-- VENDORS -->
  <div class="card">

    <h2>All Vendors</h2>

    <div id="vendorBox"></div>

  </div>

</div>

<script type="module" src="./app.js"></script>

</body>
</html>
