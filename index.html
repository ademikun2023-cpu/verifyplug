<!DOCTYPE html>
<html>
<head>
  <title>VerifyPlug</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <p id="userInfo"></p>
  <div class="container">

  <div class="header">
    <h1>VerifyPlug 🔍</h1>
    <p class="sub">Check vendors before sending money</p>
  </div>

  <!-- SEARCH -->
  <div class="card">
    <div class="label">Search Vendor</div>

    <div class="stack">
      <input id="searchInput" placeholder="Enter phone number">
      <button onclick="searchVendor()">Search</button>
    </div>

    <div id="result"></div>
  </div>

  <!-- ADD VENDOR -->
  <div class="card">
    <div class="label">Add Vendor</div>

    <div class="stack">
      <input id="name" placeholder="Vendor Name">
      <input id="phone" placeholder="Phone Number">
      <button onclick="addVendor()">Submit</button>
    </div>
  </div>

  <!-- REVIEW -->
  <div class="card">
    <div class="label">Add Review</div>

    <div class="stack">
      <input id="reviewPhone" placeholder="Vendor Phone">
      <input id="rating" placeholder="Rating (1-5)">
      <input id="comment" placeholder="Comment">
      <button onclick="addReview()">Send Review</button>
    </div>
  </div>

  <!-- SCAM -->
  <div class="card">
    <div class="label">Report Scam</div>

    <div class="stack">
      <input id="scamPhone" placeholder="Vendor Phone">
      <input id="scamReason" placeholder="Reason">
      <button onclick="reportScam()">Report</button>
    </div>
  </div>

</div>
</body>
</html>
