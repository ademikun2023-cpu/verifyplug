<!DOCTYPE html>
<html>
<head>
  <title>Customer Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="topbar">
  VerifyPlug
</div>

<div class="container">

  <!-- HERO -->
  <div class="hero-card">

    <div class="hero-logo">🔍</div>

    <h1 id="welcomeText">Hi Customer 👋</h1>

    <p class="hero-sub">
      Verify vendors before payment and avoid scams.
    </p>

    <div class="stats-box">
      <div class="stats-number" id="weeklySearches">0</div>
      <div class="stats-label">
        Vendors searched this week
      </div>
    </div>

  </div>

  <!-- SEARCH -->
  <div class="card">

    <h2>Search Vendor</h2>

    <input
      id="searchInput"
      placeholder="Enter vendor phone number"
    >

    <button onclick="searchVendor()">
      Search
    </button>

    <div id="result"></div>

  </div>

  <!-- REPORT SCAM -->
  <div class="card">

    <h2>Report Scam</h2>

    <input
      id="scamPhone"
      placeholder="Vendor phone number"
    >

    <input
      id="scamReason"
      placeholder="Reason"
    >

    <button onclick="reportScam()">
      Report Scam
    </button>

  </div>

</div>
<!-- TOAST -->
<div id="toast"></div>
<script type="module" src="./app.js"></script>

</body>
</html>
