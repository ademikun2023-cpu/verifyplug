<!DOCTYPE html>
<html>
<head>
  <title>VerifyPlug - Customer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body><div class="container">

  <div class="header">
    <h1>Customer Dashboard 🔍</h1>
    <p class="sub">Search and verify vendors</p>
  </div>

  <div class="card">
    <div class="label">Search Vendor</div>

    <div class="stack">
      <input id="searchInput" placeholder="Phone number">
      <button onclick="searchVendor()">Search</button>
    </div>
<div style="margin-top:10px;">
  <div style="font-size:12px; opacity:0.7;">Trust Score</div>

  <div style="height:10px; background:#1f2937; border-radius:20px; overflow:hidden; margin-top:6px;">
    <div style="width:70%; height:100%; background:linear-gradient(90deg,#22c55e,#16a34a);"></div>
  </div>

  <div style="font-size:12px; margin-top:6px; opacity:0.7;">
    70% Trusted
  </div>
</div>
    <div id="result"></div>
  </div>

  <div class="card">
    <div class="label">Report Scam</div>

    <div class="stack">
      <input id="scamPhone" placeholder="Phone">
      <input id="scamReason" placeholder="Reason">
      <button onclick="reportScam()">Report</button>
    </div>
  </div>

</div>

  <script type="module" src="app.js"></script>
</body>
</html>
