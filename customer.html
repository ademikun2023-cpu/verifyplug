<!DOCTYPE html>
<html>
<head>
  <title>VerifyPlug - Customer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>VerifyPlug 🔍</h1>
      <p class="sub">Check if vendors are trusted before paying</p>
    </div>

    <!-- SEARCH VENDOR -->
    <div class="card">
      <div class="label">Search Vendor</div>

      <div class="stack">
        <input id="searchInput" placeholder="Enter phone number">
        <button onclick="searchVendor()">Search</button>
      </div>

      <div id="result"></div>
    </div>

    <!-- ADD REVIEW -->
    <div class="card">
      <div class="label">Add Review</div>

      <div class="stack">
        <input id="reviewPhone" placeholder="Vendor Phone">
        <input id="rating" placeholder="Rating (1-5)">
        <input id="comment" placeholder="Comment">
        <button onclick="addReview()">Send Review</button>
      </div>
    </div>

    <!-- REPORT SCAM -->
    <div class="card">
      <div class="label">Report Scam</div>

      <div class="stack">
        <input id="scamPhone" placeholder="Vendor Phone">
        <input id="scamReason" placeholder="Reason">
        <button onclick="reportScam()">Report</button>
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
