<!DOCTYPE html>
<html>
<head>
  <title>Customer Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/logo.png" type="image/png">
</head>

<body>

<div class="topbar">
  VerifyPlug
</div>

<div class="container">

  <!-- HERO -->
  <div class="hero-card">

    <div class="hero-logo">🔍</div>

    <h1 id="welcomeText">Hi Customer 👋</h1>

    <p class="hero-sub">
      Verify vendors before payment and avoid scams.
    </p>

    <div class="stats-box">
      <div class="stats-number" id="weeklySearches">0</div>
      <div class="stats-label">
        Vendors searched this week
      </div>
    </div>

  </div>

  <!-- SEARCH -->
  <div class="card">

    <h2>Search Vendor</h2>

    <input
      id="searchInput"
      placeholder="Enter vendor phone number"
    >

    <button onclick="searchVendor()">
      Search
    </button>

    <div id="result"></div>

  </div>
  <div class="premium-wrapper">

  <div class="premium-section-title">
    ⭐ Trusted Premium Vendors
  </div>

  <div class="premium-section-subtitle">
    Browse trusted vendors by category
  </div>

  <select id="premiumCategoryFilter">

    <option value="All">
      All Categories
    </option>

    <option value="Gaming">
      Gaming
    </option>

    <option value="Digital Services">
      Digital Services
    </option>

    <option value="Physical Goods">
      Physical Goods
    </option>

    <option value="Food & Drinks">
      Food & Drinks
    </option>

    <option value="Fashion">
      Fashion
    </option>

    <option value="Tech">
      Tech
    </option>

    <option value="Crypto">
      Crypto
    </option>

    <option value="VTU">
      VTU
    </option>

    <option value="Logistics">
      Logistics
    </option>

    <option value="Others">
      Others
    </option>

  </select>

  <div id="premiumVendors"></div>

</div>
  <!-- REPORT SCAM -->
  <div class="card">

    <h2>Report Scam</h2>

    <input
      id="scamPhone"
      placeholder="Vendor phone number"
    >

    <input
      id="scamReason"
      placeholder="Reason"
    >

    <button onclick="reportScam()">
      Report Scam
    </button>

  </div>

</div>
<!-- TOAST -->
<div id="toast"></div>
<!-- REVIEW MODAL -->
<div id="reviewModal" class="modal">

  <div class="modal-content">

    <h2>Share Your Experience</h2>

    <!-- RATING -->
    <input
      type="number"
      id="reviewRating"
      placeholder="Rate vendor (1-10)"
      min="1"
      max="10"
    >

    <!-- PURCHASE CODE -->
    <input
      id="purchaseCode"
      placeholder="Purchase Code (optional)"
    >

    <!-- PROS -->
    <textarea
      id="reviewPros"
      placeholder="What went well?"
    ></textarea>

    <!-- CONS -->
    <textarea
      id="reviewCons"
      placeholder="Anything they could improve?"
    ></textarea>

    <div class="modal-buttons">

      <button onclick="submitReview()">
        Submit Review
      </button>

      <button onclick="closeReviewModal()">
        Cancel
      </button>

    </div>

  </div>

</div>
<!-- REVIEWS MODAL -->
<div id="reviewsModal" class="modal">

  <div class="modal-content">

    <h2>Customer Reviews</h2>

    <div id="reviewsContainer"></div>

    <div class="modal-buttons">

      <button onclick="closeReviewsModal()">
        Close
      </button>

    </div>

  </div>

</div>
<script type="module" src="./app.js"></script>

</body>
</html>
