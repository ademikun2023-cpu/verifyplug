<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerifyPlug — Auth</title>

  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/logo.png" type="image/png">
</head>

<body>

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="brand">
      <span class="brand-seal"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.2 4.2L19 7" stroke="#1a1505" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      VerifyPlug
    </div>
    <a href="index.html" class="topbar-tag">← Back to home</a>
  </div>

  <!-- AUTH WRAPPER -->
  <div style="min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:40px 20px;">

    <div style="width:100%;max-width:430px;" class="reveal">

      <div style="text-align:center;margin-bottom:28px;">
        <div class="eyebrow" style="margin-bottom:16px;">Welcome back</div>
        <h1 style="font-size:32px;">Verify vendors. Stay safe.</h1>
        <p style="margin-top:10px;">Sign in or create an account to start checking trust scores.</p>
      </div>

      <div class="card" style="padding:26px;">

        <div style="margin-bottom:14px;">
          <label>Email</label>
          <input id="emailInput" type="email" placeholder="you@example.com">
        </div>

        <div style="margin-bottom:14px;">
          <label>Password</label>
          <input id="passwordInput" type="password" placeholder="••••••••">
        </div>

        <div style="margin-bottom:6px;">
          <label>Account type</label>
          <select id="roleInput">
            <option value="customer">Customer</option>
            <option value="vendor">Vendor</option>
          </select>
        </div>

        <button onclick="signup()">Create account</button>
        <button onclick="login()" class="btn-secondary">Sign in</button>

      </div>

      <p style="text-align:center;margin-top:18px;font-size:12px;color:var(--faint);">
        By continuing you agree to VerifyPlug safety policies.
      </p>

    </div>
  </div>

  <div id="toast"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
